name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache
      - name: Install Buildozer
        run: pip install --upgrade pip cython==0.29.36 buildozer
      - name: Build APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: Show error context
        if: failure()
        shell: bash
        run: |
          n=$(grep -n "# Command failed" build.log | head -1 | cut -d: -f1)
          if [ -n "$n" ]; then sed -n "$((n>80 ? n-80 : 1)),$((n-1))p" build.log; fi
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-apk
          path: bin/*.apk
